name: Formatly quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install development dependencies
        run: python -m pip install -r requirements.txt
      - name: Frontend checks and production resources
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Python checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          ruff check . --no-cache
          pyright
          python -m unittest discover -s tests -q
          python -m pip check

  business-and-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install chromium
      - name: Complete fixed corpus and additive mutations
        run: python -B scripts/quality_gate.py --download-sources --output .verification/business-quality
      - name: Input compatibility and academic structure
        run: |
          python -B scripts/evaluate_compatibility_dataset.py --output .verification/compatibility
          python -B scripts/evaluate_academic_structure.py --output .verification/academic-structure
      - name: Browser workflows, layout comparisons and accessibility
        working-directory: frontend
        env:
          FORMATLY_TEST_PYTHON: python
          FORMATLY_COMPARE_SCREENSHOTS: '1'
        run: npm run test:browser
      - name: Archive quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-and-browser
          path: |
            .verification/business-quality/quality.json
            .verification/compatibility/summary.json
            .verification/compatibility/results/
            .verification/academic-structure/summary.json
            .verification/browser-report/
            .verification/browser-results/
          if-no-files-found: ignore

  additional-school-corpus:
    # This independent job preserves an unsuccessful source-compilation result
    # without preventing browser regression from running. Its exit status is
    # not relaxed. OCR availability is recorded by the real document reader;
    # this runner does not silently install models or enlarge runtime budgets.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Build local report resources
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Additional official originals and independent submissions
        run: python -B scripts/evaluate_school_expansion.py --download-sources --output .verification/school-expansion
      - name: Archive school-corpus results, including unsuccessful extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-school-corpus
          path: |
            .verification/school-expansion/summary.json
            .verification/school-expansion/metrics.json
            .verification/school-expansion/gold.json
          if-no-files-found: ignore
